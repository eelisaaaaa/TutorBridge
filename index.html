
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorBridge — International Tutor-Matching Platform</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="global-navbar"></div>
  <main class="container">
    <!-- Page Ownership Header -->
    <div style="text-align:right; margin-bottom:12px;">
      <span class="owner-pill">Page Owner: Elisa</span>
    </div>
    <!-- Hero Banner -->
    <section class="hero">
      <h1>Find affordable, quality tuition</h1>
      <p class="subline">Verified cross-border tutors delivering 1-on-1 Singapore O &amp; N-Level guidance at real savings.</p>
      
      <form action="tutor-profile.html" method="GET" class="search-bar">
        <select class="form-select" name="subject">
          <option value="">Select Subject (All)</option>
          <option value="emath">Elementary Mathematics</option>
          <option value="amath">Additional Mathematics</option>
          <option value="physics">Physics (Pure / Combined)</option>
          <option value="chem">Chemistry (Pure / Combined)</option>
          <option value="bio">Biology (Pure / Combined)</option>
          <option value="english">English Language</option>
        </select>
        <select class="form-select" name="level">
          <option value="">Level: All</option>
          <option value="O-Level">O-Level (Sec 3-5)</option>
          <option value="N-Level">N-Level (Sec 1-4)</option>
        </select>
        <button type="submit" class="btn btn-primary" style="white-space:nowrap;">Find a Tutor</button>
      </form>
    </section>
    <!-- Savings Snapshot -->
