<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Tutor — TutorBridge</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/tutorprofile.css">
</head>

<body>

  <div id="global-navbar"></div>

  <main class="container">

    <div class="page-owner">
      <span class="owner-pill">Page Owner: Zi Xuan</span>
    </div>

    <div class="page-header">
      <h1>Find Your Tutor</h1>
      <p>Swipe right to shortlist tutors or dismiss to see the next available profile.</p>
    </div>

    <div class="swipe-wrapper">

      <div class="swipe-card-stack" id="swipe-stack">
        <!-- JS renders cards -->
      </div>

      <div class="swipe-instructions">
        <span>&larr; Swipe left (Dismiss)</span>
        <span>Swipe right (Shortlist) &rarr;</span>
      </div>

      <div class="swipe-controls">

        <button
          class="swipe-btn dismiss"
          title="Dismiss"
          onclick="handleSwipe('left')">
          &times;
        </button>

        <div class="swipe-message">
          Tap actions or drag card
        </div>

        <button
          class="swipe-btn shortlist"
          title="Shortlist"
          onclick="handleSwipe('right')">
          &hearts;
        </button>

      </div>

      <div class="shortlist-container">
        <a href="../pages/shortlist.html" class="btn btn-ghost">
          View Your Shortlist &rarr;
        </a>
      </div>

    </div>

  </main>

  <div id="global-footer"></div>

  <script src="../assets/javascript/tutors-data.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <script src="../assets/javascript/swipe.js"></script>

</body>
</html>
