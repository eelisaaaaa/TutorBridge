<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Tutor — TutorBridge</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <nav id="global-navbar"></nav>

  <main class="container">

    <p class="page-owner">
      <span class="owner-pill">Page Owner: Zi Xuan</span>
    </p>

    <header class="page-header">
      <h1>Find Your Tutor</h1>
      <p>Swipe right to shortlist tutors or dismiss to see the next available profile.</p>
    </header>

    <section class="swipe-wrapper">

      <section class="swipe-card-stack" id="swipe-stack">
        <!-- JS renders cards -->
      </section>

      <p class="swipe-instructions">
        <span>&larr; Swipe left (Dismiss)</span>
        <span>Swipe right (Shortlist) &rarr;</span>
      </p>

      <section class="swipe-controls">

        <button
          class="swipe-btn dismiss"
          title="Dismiss"
          id="dismiss-btn">
          &times;
        </button>

        <p class="swipe-message">
          Tap actions or drag card
        </p>

        <button
          class="swipe-btn shortlist"
          title="Shortlist"
          id="shortlist-btn">
          &check;
        </button>

      </section>

      <p class="shortlist-container">
        <a href="../pages/shortlist.html" class="btn btn-ghost">
          View Your Shortlist &rarr;
        </a>
      </p>

    </section>

  </main>

  <footer id="global-footer"></footer>

  <script src="../assets/javascript/tutors-data.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <script src="../assets/javascript/swipe.js"></script>

  <script src="../assets/javascript/tutors-data.js"></script>
  <script src="../assets/javascript/main.js"></script>
  <script src="../assets/javascript/swipe.js"></script>
</body>
</html>
